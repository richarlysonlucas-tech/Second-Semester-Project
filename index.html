
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Mark of Balance - Teste de Áudio</title>

    <style>
        body {
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }

        button {
            background: #303030;
            color: white;
            border: 1px solid #666;
            padding: 15px;
            margin: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #236b42;
        }
    </style>
</head>

<body>
    <h1>MARK OF BALANCE</h1>
    <h2>Teste de Efeitos Sonoros</h2>

    <button onclick="testar('zombie')">🧟 Zombie</button>
    <button onclick="testar('golem')">🪨 Golem</button>
    <button onclick="testar('magic')">✨ Magic</button>
    <button onclick="testar('regeneration')">💚 Regeneration</button>
    <button onclick="testar('killEnemy')">⚔️ Kill Enemy</button>
    <button onclick="testar('gameOver')">💀 Game Over</button>

<button onclick="testar('sword')">⚔️ Espada</button>
<button onclick="testar('walking')">👣 Andando</button>
<button onclick="testar('collect')">🎁 Coletar</button>
<button onclick="testar('interface')">🖱️ Interface</button>
<button onclick="testarMusica()">🎵 Música</button>
<button onclick="pararMusica()">⏹️ Parar Música</button>

    <p id="status">Clique em um botão para testar.</p>

    <script type="module">
        import AudioManager from "./js/audio/AudioManager.js";

        const audio = new AudioManager();

window.testarMusica = function() {
    audio.playMusic("assets/audio/music/music.mp3");
};

window.pararMusica = function() {
    audio.stopMusic();
};

        window.testar = function(nome) {
            audio.playSound(nome);
            document.getElementById("status").textContent =
                "Testando áudio: " + nome;
        };
    </script>
</body>
</html>
